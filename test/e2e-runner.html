<!doctype html>
<!-- E2E runner: loads the real game in a same-origin iframe and drives it like
     a player. Writes one "E2E <name>: PASS|FAIL <detail>" line per scenario
     into this document's body; test/e2e.test.js parses chromium --dump-dom. -->
<html>
<head><meta charset="UTF-8"><title>E2E</title></head>
<body>
<iframe id="game" src="../index.html" style="width:420px;height:820px"></iframe>
<pre id="results"></pre>
<script>
const results = [];
function report(name, ok, detail) {
  results.push('E2E ' + name + ': ' + (ok ? 'PASS' : 'FAIL') + (detail ? ' — ' + detail : ''));
}
function q(sel) { return gameDoc().querySelector(sel); }
function gameDoc() { return document.getElementById('game').contentDocument; }
function gameWin() { return document.getElementById('game').contentWindow; }
function money() { return parseInt((q('#m').textContent || '').replace(/[^\d]/g, ''), 10) || 0; }
function weedStock() {
  const m = (q('#stw').textContent || '').match(/([\d.]+)K?/);
  if (!m) return 0;
  return m[0].includes('K') ? parseFloat(m[1]) * 1000 : parseFloat(m[1]);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** Décode un fmt court (1.2K / 3.45M / 1234) en nombre, pour comparer des stats. */
function fmtNum(s) {
  const m = String(s || '').match(/([\d.]+)([KM]?)/);
  if (!m) return 0;
  const v = parseFloat(m[1]);
  return m[2] === 'K' ? v * 1000 : m[2] === 'M' ? v * 1e6 : v;
}

/** Attend qu'un sélecteur existe (le reload d'iframe n'est pas instantané).
    Retourne le nœud, ou null si absent après `ms`. */
async function waitFor(sel, ms = 3000) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) {
    const n = q(sel);
    if (n) return n;
    await sleep(50);
  }
  return q(sel);
}

/** Recharge le jeu depuis zéro et attend que le nouveau document ait fini de
    charger (événement `load` de l'iframe) PUIS que ui.js ait booté — le
    `waitFor('#m')` seul ne suffit pas : l'élément statique existe déjà dans
    l'ANCIEN document pendant la transition, ce qui faisait cliquer trop tôt. */
function reloadGame() {
  const game = document.getElementById('game');
  return new Promise((resolve) => {
    game.addEventListener('load', () => {
      // un micro-délai laisse ui.js finir de rendre les upgrade cards (boot)
      setTimeout(async () => { await waitFor('#ul-auto-joint'); resolve(); }, 120);
    }, { once: true });
    game.src = '../index.html';
  });
}

async function scenario() {
  const w = gameWin();
  await sleep(800); // boot + first toast

  try {
    // 1. boot state
    const bud = q('#bs svg');
    report('boot', !!bud && q('#m').textContent.includes('€') &&
      q('#sb').textContent.includes('Green Dream'), 'svg=' + !!bud);

    // 2. clicking harvests weed + xp
    const before = weedStock();
    q('#bs').click(); q('#bs').click(); q('#bs').click();
    await sleep(120);
    report('harvest-click', weedStock() >= before + 2, 'stock ' + before + '->' + weedStock());

    // 3. space key harvests too
    const b2 = weedStock();
    gameDoc().dispatchEvent(new KeyboardEvent('keydown', { code: 'Space', bubbles: true }));
    await sleep(120);
    report('harvest-space', weedStock() >= b2 + 1, 'stock ' + b2 + '->' + weedStock());

    // 3b. combo UI: pill + barre FLOTTANTES au-dessus du bud — le bud ne bouge
    // JAMAIS d'un pixel quand le combo apparaît (régression layout)
    const budTop = q('#bc').offsetTop;
    for (let i = 0; i < 5; i++) q('#bs').click();
    await sleep(150);
    const comboWrap = q('#combo-wrap');
    const comboVisible = comboWrap && !comboWrap.hidden && /Combo/.test((q('#combo-pill').textContent || ''));
    const floating = comboWrap && getComputedStyle(comboWrap).position === 'absolute';
    const budTopAfter = q('#bc').offsetTop;
    report('combo-ui', !!comboVisible && !!floating && budTopAfter === budTop,
      comboWrap ? 'hidden=' + comboWrap.hidden + ' pos=' + getComputedStyle(comboWrap).position + ' budTop ' + budTop + '->' + budTopAfter : 'no wrap');

    // 4. buy first upgrade (150 € needs clicks: seed via many clicks is slow — use craft/sell loop instead)
    // sell raw weed to afford Ciseaux Pro
    w.BudGame; // sanity: game exposed
    // switch to sell tab via deep-link behaviour: click tab button
    q('.tab-btn[data-tab="sell"]').click();
    await sleep(100);
    report('tab-switch', q('#v-sell').classList.contains('active'), '');

    // 5. market renders 15 cards (weed + 14 produits) with trend arrows + qty pills
    const cards = gameDoc().querySelectorAll('#market-grid .market-card').length;
    const trends = gameDoc().querySelectorAll('#market-grid .trend').length;
    report('market-render', cards === 15 && trends >= 15, 'cards=' + cards + ' trends=' + trends);

    // 6. sell weed raw -> money grows
    const moneyBefore = money();
    q('[data-p="weed"]').click();
    await sleep(120);
    report('sell-weed', money() > moneyBefore, moneyBefore + '->' + money());

    // 7. qty pills change labels
    gameDoc().querySelector('[data-q="max"]').click();
    await sleep(100);
    const maxLabel = q('[data-p="weed"]').textContent;
    gameDoc().querySelector('[data-q="1"]').click();
    report('qty-pills', /tout|max/i.test(maxLabel), maxLabel.trim());

    // 8. craft a joint (2g) then sell it
    // ensure enough weed first
    for (let i = 0; i < 5; i++) q('#bs').click();
    q('.tab-btn[data-tab="sell"]').click();
    await sleep(80);
    const jointCard = [...gameDoc().querySelectorAll('.market-card')].find((c) => c.textContent.includes('Joint'));
    const craftBtn = jointCard.querySelector('.craft');
    const haveWeed = weedStock();
    if (!craftBtn.disabled) {
      craftBtn.click();
      await sleep(100);
      const sellBtn = jointCard.querySelector('.sell');
      const sold = money();
      sellBtn.click();
      await sleep(100);
      report('craft-sell', money() >= sold, 'joint crafted & sold');
    } else {
      report('craft-sell', false, 'craft disabled with ' + haveWeed + 'g');
    }

    // 9. upgrade purchase via Upgrades tab (seed a rich save, reload iframe so
    // the game boots from it, then buy like a player)
    w.localStorage.setItem('budClicker', JSON.stringify({ weed: 0, money: 100000, strain: 'green', stock: { weed: 0, weedByStrain: {}, strains: ['green'] }, prices: { weed: 6 }, levels: { harvest: 1, auto: 0 }, xp: 0, totalEarned: 0 }));
    document.getElementById('game').src = '../index.html';
    await sleep(900);
    q('.tab-btn[data-tab="upgrades"]').click();
    await sleep(120);
    const harvestBtn = q('#ub-harvest');
    report('upgrade-buy', !harvestBtn.disabled && q('#ul-harvest').textContent.includes('Lvl 1'),
      'label=' + q('#ul-harvest').textContent);
    harvestBtn.click();
    await sleep(120);
    report('upgrade-level', q('#ul-harvest').textContent.includes('Lvl 2'), q('#ul-harvest').textContent);

    // 10. automation locked below level: auto-rosin (lvl 49) must be disabled
    // (onglet Chaînes : les cartes ne sont mises à jour que lorsque visible)
    q('[data-utab="chains"]').click();
    await sleep(150);
    const rosinBtn = q('#ub-auto-rosin');
    const rosinBadge = q('#ul-auto-rosin');
    report('auto-locked', rosinBtn.disabled && rosinBadge.textContent.includes('🔒'), rosinBadge.textContent);
    q('[data-utab="hw"]').click();
    await sleep(100);

    // 11. no storage cap: big stock accumulates freely, no banner, no pulse
    w.localStorage.setItem('budClicker', JSON.stringify({ weed: 0, money: 5000, strain: 'green', stock: { weed: 0, weedByStrain: {}, strains: ['green'] }, prices: { weed: 6 }, levels: { harvest: 1, auto: 0 }, xp: 0, totalEarned: 0 }));
    document.getElementById('game').src = '../index.html';
    await sleep(900);
    for (let i = 0; i < 30; i++) q('#bs').click();
    await sleep(150);
    const stockBig = weedStock() >= 25;
    const bannerGone = !q('#full-warn');
    report('no-cap', stockBig && bannerGone, 'stock=' + weedStock() + ' banner=' + (!bannerGone));

    // 12. save persistence: reload keeps money
    const moneyPersist = money();
    await reloadGame();
    report('persistence', money() === moneyPersist, moneyPersist + ' vs ' + money());

    // 13. milestones: built once, updated in place (node identity survives ticks)
    q('.tab-btn[data-tab="progress"]').click();
    await sleep(80);
    const msItems = gameDoc().querySelectorAll('#ms .ms-item');
    const firstNode = msItems[0];
    await sleep(1300); // > 1 autoProduce tick: an innerHTML rebuild would swap the node
    const msAfter = gameDoc().querySelectorAll('#ms .ms-item');
    report('milestones-stable', msItems.length === 13 && msAfter.length === 13 && msAfter[0] === firstNode,
      'count=' + msAfter.length + ' sameNode=' + (msAfter[0] === firstNode));

    // 14. toast dedup: spamming a broke buy shows ONE toast, not a stack
    w.localStorage.setItem('budClicker', JSON.stringify({ weed: 0, money: 0, strain: 'green', stock: { weed: 0, weedByStrain: {}, strains: ['green'] }, prices: { weed: 6 }, levels: { harvest: 1, auto: 0 }, xp: 0, totalEarned: 0 }));
    await reloadGame();
    q('.tab-btn[data-tab="upgrades"]').click();
    await sleep(100);
    const brokeBtn = q('#ub-harvest');
    // dispatchEvent plutôt que .click() : avec money=0 le bouton est disabled et
    // chromium avale .click() — on vérifie la DEDUP de toasts, pas l'état disabled.
    brokeBtn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    brokeBtn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    brokeBtn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    await sleep(150);
    const toasts = gameDoc().querySelectorAll('#mc .ms').length;
    report('toast-dedup', toasts === 1, 'toasts=' + toasts);

    // 14b. chain spec tree: built ONCE, updated in place — node identity
    // survives ticks (regression: innerHTML rebuild per tick detached the
    // spec buttons mid-tap and killed bar transitions)
    w.localStorage.setItem('budClicker', JSON.stringify({
      weed: 0, money: 1000000000, strain: 'green',
      stock: { weed: 0, weedByStrain: {}, strains: ['green'] }, prices: { weed: 6 },
      levels: { harvest: 1, auto: 0 }, xp: 2300000000, totalEarned: 0,
      chainLvl: { joint: 5 }, chainSpecs: { joint: { speed: 0, yield: 0, volume: 0 } }
    }));
    await reloadGame();
    q('.tab-btn[data-tab="upgrades"]').click();
    await sleep(100);
    q('[data-utab="chains"]').click();
    const specFill = await waitFor('#cs-joint-speed-fill');
    const specBuy = await waitFor('#cs-joint-speed-buy');
    const specBuilt = !!specFill && !!specBuy;
    await sleep(1300); // > 1 autoProduce tick: un rebuild échangerait les nœuds
    const sameSpecNode = q('#cs-joint-speed-fill') === specFill;
    if (specBuy) specBuy.click(); // réf capturée AVANT le tick : doit toujours acheter
    await sleep(200);
    const specCount = (q('#cs-joint-speed-count') || {}).textContent || '';
    report('spec-bars-stable', specBuilt && sameSpecNode && specCount.indexOf('1/') === 0,
      'built=' + specBuilt + ' sameNode=' + sameSpecNode + ' count=' + specCount);

    // 14c. stats idle justes & réactives : le header €/s est DÉRIVÉ de state
    // (chainEarnRate) — un achat de spé (plus de flux transformé) doit le faire
    // croître immédiatement, pas après 10s d'historique. (une chaîne active :
    // flux auto + craft/sell dispos)
    w.localStorage.setItem('budClicker', JSON.stringify({
      weed: 0, money: 1000000000, strain: 'green',
      stock: { weed: 0, weedByStrain: {}, strains: ['green'] }, prices: { weed: 6 },
      levels: { harvest: 1, auto: 200 }, xp: 2300000000, totalEarned: 0,
      chainLvl: { joint: 1 }, chainSpecs: { joint: { speed: 0, yield: 0, volume: 0 } },
      auto: { craft: { joint: true }, sell: { joint: true } }
    }));
    await reloadGame();
    q('.tab-btn[data-tab="upgrades"]').click();
    await sleep(200);
    q('[data-utab="chains"]').click();
    const specBtn = await waitFor('#cs-joint-speed-buy');
    await sleep(100); // laisse le header €/s idle se poser sur ce seed
    const mpsBefore = fmtNum(q('#mps').textContent);
    const wasEnabled = !!specBtn && !specBtn.disabled;
    if (specBtn) specBtn.click();
    await sleep(200);
    const mpsAfter = fmtNum(q('#mps').textContent);
    const toastDiamond = [...gameDoc().querySelectorAll('#mc .ms')]
      .some((t) => t.textContent.includes('💎'));
    const specCnt = (q('#cs-joint-speed-count') || {}).textContent || '';
    report('idle-stats-reactive', wasEnabled && mpsBefore > 0 && mpsAfter >= mpsBefore &&
      toastDiamond && specCnt.indexOf('1/') === 0,
      'mps ' + mpsBefore + '->' + mpsAfter + ' 💎=' + toastDiamond + ' count=' + specCnt);

    // 15. reset dialog: first click arms (animated state), second confirms
    q('.tab-btn[data-tab="progress"]').click();
    await sleep(80);
    q('#rb').click();
    await sleep(80);
    const armed = q('#rb').classList.contains('armed') && q('#rb').textContent.includes('Confirmer');
    q('#rb').click();
    await sleep(150);
    report('reset-dialog', armed && money() === 0 && q('#sb').textContent.includes('Green Dream'),
      'armed=' + armed + ' money=' + money());
  } catch (e) {
    report('scenario-crash', false, String((e && e.stack) || e));
  }

  document.getElementById('results').textContent = results.join('\n');
  document.title = 'E2E DONE ' + results.filter((r) => r.includes('FAIL')).length + ' failures';
}

window.addEventListener('load', () => scenario());
</script>
</body>
</html>
